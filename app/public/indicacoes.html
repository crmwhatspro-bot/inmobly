<head>

<!-- Sinal de analytics — vem ANTES do GTM de propósito: o page_view sai
     antes do Firebase Auth resolver, então quem já se identificou numa
     visita anterior é classificado por esta chave, gravada por
     marcarSinalAnalytics() em js/shell.js. Ver docs/ANALYTICS-JORNADA.md. -->
<script>
(function () {
  window.dataLayer = window.dataLayer || [];
  try {
    var sinal = JSON.parse(localStorage.getItem('sitemob_ga') || '{}');
    if (sinal.traffic_type) window.dataLayer.push({ traffic_type: sinal.traffic_type });
    if (sinal.user_id) window.dataLayer.push({ user_id: sinal.user_id });
  } catch (e) { /* localStorage bloqueado — segue sem classificar */ }
})();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Indique e ganhe — Sitemob</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/planos.css">

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MX2GH99M"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="admin-dashboard visible">
  <div id="shell-sidebar-mount"></div>
  <div class="admin-content">
    <div id="shell-topbar-mount"></div>
    <main class="admin-main">

      <div class="planos-wrap">
        <div class="planos-head">
          <h1>Indique e ganhe</h1>
          <p>Compartilhe seu link. A cada indicação que assina um plano pago, você ganha um cupom de 10% off — sem prazo pra usar. Acumule até 5 cupons (um por indicação, aplicado um de cada vez) e economize até 50% ao longo das próximas faturas.</p>
        </div>

        <section class="indicacoes-card">
          <div class="indicacoes-link">
            <input type="text" id="indicacaoLink" readonly aria-label="Seu link de indicação">
            <button type="button" class="btn btn--outline-light btn--sm" id="indicacaoCopiarLink">Copiar link</button>
          </div>

          <p class="indicacoes-status" id="indicacoesStatus">—</p>

          <div class="indicacoes-codigos" id="indicacoesCodigos" hidden></div>

          <button type="button" class="btn btn--accent btn--sm" id="indicacaoAplicarBtn" hidden>Aplicar cupom na próxima fatura</button>
          <p class="indicacoes-status" id="indicacoesAplicarMsg" hidden></p>
        </section>
      </div>

    </main>
  </div>
</div>

<script type="module" src="js/indicacoes.js"></script>
</body>
</html>
