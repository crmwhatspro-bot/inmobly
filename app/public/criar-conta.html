<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Sinal de analytics — vem ANTES do GTM de propósito: o page_view sai
     antes do Firebase Auth resolver, então quem já se identificou numa
     visita anterior é classificado por esta chave, gravada por
     marcarSinalAnalytics() em js/shell.js. Ver docs/ANALYTICS-JORNADA.md. -->
<script>
(function () {
  window.dataLayer = window.dataLayer || [];
  try {
    var sinal = JSON.parse(localStorage.getItem('sitemob_ga') || '{}');
    if (sinal.traffic_type) window.dataLayer.push({ traffic_type: sinal.traffic_type });
    if (sinal.user_id) window.dataLayer.push({ user_id: sinal.user_id });
  } catch (e) { /* localStorage bloqueado — segue sem classificar */ }
})();
</script>
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-MX2GH99M');</script>
<!-- End Google Tag Manager -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Sitemob</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>


<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MX2GH99M"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="center-screen">
  <div class="card">
    <div class="card__logo">Sitemob<span>.</span></div>
    <h1>Vamos criar sua conta</h1>
    <p class="sub">30 segundos. Seu site já nasce no ar, com o trial de 14 dias ativado.</p>

    <form id="formConta">
      <div class="field">
        <label for="nome">Seu nome / nome do negócio</label>
        <input type="text" id="nome" required placeholder="Ex: João Silva Imóveis" autocomplete="name">
      </div>

      <div class="field">
        <label for="slug">Endereço do seu site</label>
        <input type="text" id="slug" required placeholder="joao-silva" pattern="[a-z0-9\-]+"
               autocomplete="off" spellcheck="false">
        <p class="field__hint"><strong id="slugPreview">seu-slug</strong>.sitemob.app — só letras minúsculas, números e hífen</p>
        <p class="field__warn">Esse será o link do seu site: <strong id="slugPreviewWarn">seu-slug</strong>.sitemob.app — depois de criada a conta não é possível trocar. Escolha com atenção.</p>
        <p class="field__error" id="slugError"></p>
      </div>

      <button class="btn btn--primary btn--block" type="submit" id="btnCriar">Criar minha conta →</button>
      <p class="msg" id="contaMsg"></p>
    </form>
  </div>
</div>

<script type="module" src="js/criar-conta.js"></script>
</body>
</html>
