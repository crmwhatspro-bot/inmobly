<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Sinal de analytics — vem ANTES do GTM de propósito: o page_view sai
     antes do Firebase Auth resolver, então quem já se identificou numa
     visita anterior é classificado por esta chave, gravada por
     marcarSinalAnalytics() em js/shell.js. Ver docs/ANALYTICS-JORNADA.md. -->
<script>
(function () {
  window.dataLayer = window.dataLayer || [];
  try {
    var sinal = JSON.parse(localStorage.getItem('sitemob_ga') || '{}');
    if (sinal.traffic_type) window.dataLayer.push({ traffic_type: sinal.traffic_type });
    if (sinal.user_id) window.dataLayer.push({ user_id: sinal.user_id });
  } catch (e) { /* localStorage bloqueado — segue sem classificar */ }
})();
</script>
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-MX2GH99M');</script>
<!-- End Google Tag Manager -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Sitemob</title>
<meta name="description" content="Entre na sua conta Sitemob ou comece seu teste grátis de 14 dias.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MX2GH99M"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="center-screen">
  <div class="card" id="loginCard" data-estado="verificando">
    <div class="card__logo">Sitemob<span>.</span></div>

    <!-- Estado inicial é o spinner, não o formulário: quem cai aqui já
         com sessão ativa (voltou depois de um tempo inativo, ou acabou
         de confirmar no popup do Google) vai ser redirecionado em
         seguida, e desenhar "Entrar" nesse meio-tempo só produz um
         piscar de tela de login que some sozinho. login.js revela o
         formulário abaixo só quando o Firebase confirma que não tem
         ninguém logado. -->
    <div class="card__loading" id="loginLoading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loginLoadingTexto">Verificando sua sessão…</p>
    </div>

    <div id="loginForm" class="hidden">
      <h1>Entrar</h1>
      <p class="sub">Site, catálogo e CMS para corretores de imóveis. Comece grátis por 14 dias, sem cartão.</p>

      <button class="btn btn--primary btn--block" id="btnGoogle">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M21.35 11.1H12v2.9h5.35c-.23 1.5-1.6 4.4-5.35 4.4-3.22 0-5.85-2.67-5.85-5.9s2.63-5.9 5.85-5.9c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.9 3.9 14.68 3 12 3 6.98 3 3 6.98 3 12s3.98 9 9 9c5.2 0 8.65-3.65 8.65-8.8 0-.6-.07-1.05-.15-1.5z"/></svg>
        Entrar com Google
      </button>

      <p class="msg" id="loginMsg"></p>
    </div>
  </div>
</div>

<script>
/* Rede de segurança para o caso de js/login.js nunca rodar (módulo do
   Firebase bloqueado, gstatic fora do ar): sem isto a página ficaria
   presa no spinner inicial, sem botão nenhum pra clicar. Só age
   enquanto o estado ainda for "verificando" — assim que login.js
   assume o card, ele mesmo troca esse atributo e este timer vira
   no-op. Script clássico de propósito: precisa rodar mesmo quando o
   módulo falha. */
setTimeout(function () {
  var card = document.getElementById('loginCard');
  if (!card || card.dataset.estado !== 'verificando') return;
  document.getElementById('loginLoading').classList.add('hidden');
  document.getElementById('loginForm').classList.remove('hidden');
  card.dataset.estado = 'form';
}, 8000);
</script>
<script type="module" src="js/login.js"></script>
</body>
</html>
