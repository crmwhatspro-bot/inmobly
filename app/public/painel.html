<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Inmobly</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-dashboard visible">
  <div id="shell-sidebar-mount"></div>
  <div class="admin-content">
    <div id="shell-topbar-mount"></div>
    <main class="admin-main">

      <div class="admin-metrics">
        <div class="metric-card">
          <p class="metric-card__label">Negócio</p>
          <p class="metric-card__value" style="font-size: var(--text-2xl);" id="nomeNegocio">—</p>
          <p style="color:var(--clr-text-light-2); font-size:var(--text-xs); margin-top:var(--sp-2);"><span id="slugAtual">—</span>.web.app</p>
        </div>
        <div class="metric-card">
          <p class="metric-card__label">Plano</p>
          <p class="metric-card__value" style="font-size: var(--text-2xl); text-transform:capitalize;" id="planoAtual">—</p>
        </div>
        <div class="metric-card">
          <p class="metric-card__label">Imóveis</p>
          <p class="metric-card__value" style="font-size: var(--text-2xl);" id="imoveisAtual">—</p>
        </div>
      </div>

      <div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-bottom: var(--sp-8);">
        <a href="admin.html" class="btn btn--primary">Gerenciar meus imóveis →</a>
        <a href="planos.html" class="btn btn--ghost">Ver / trocar plano</a>
      </div>

      <p style="color:var(--clr-text-light-2); font-size:0.8rem; max-width:640px; padding-top:var(--sp-6); border-top:1px dashed var(--clr-border-dark);">
        A página pública do catálogo (o que seus clientes veem) ainda não existe nesse modelo multi-tenant — "Gerenciar meus imóveis" já cadastra de verdade em <code>brokers/{tenantId}/imoveis</code>, falta só a vitrine pública.
      </p>

    </main>
  </div>
</div>

<script type="module" src="js/painel.js"></script>
</body>
</html>
