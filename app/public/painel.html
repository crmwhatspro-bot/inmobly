<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!-- Sinal de analytics — vem ANTES do GTM de propósito: o page_view sai
     antes do Firebase Auth resolver, então quem já se identificou numa
     visita anterior é classificado por esta chave, gravada por
     marcarSinalAnalytics() em js/shell.js. Ver docs/ANALYTICS-JORNADA.md. -->
<script>
(function () {
  window.dataLayer = window.dataLayer || [];
  try {
    var sinal = JSON.parse(localStorage.getItem('sitemob_ga') || '{}');
    if (sinal.traffic_type) window.dataLayer.push({ traffic_type: sinal.traffic_type });
    if (sinal.user_id) window.dataLayer.push({ user_id: sinal.user_id });
  } catch (e) { /* localStorage bloqueado — segue sem classificar */ }
})();
</script>
<!-- Google Tag Manager -->
<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
})(window,document,'script','dataLayer','GTM-MX2GH99M');</script>
<!-- End Google Tag Manager -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dashboard — Sitemob</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>


<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MX2GH99M"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="admin-dashboard visible">
  <div id="shell-sidebar-mount"></div>
  <div class="admin-content">
    <div id="shell-topbar-mount"></div>
    <main class="admin-main">

      <div class="admin-metrics">
        <div class="metric-card">
          <p class="metric-card__label">Negócio</p>
          <p class="metric-card__value" style="font-size: var(--text-2xl);" id="nomeNegocio">—</p>
          <p style="color:var(--clr-text-light-2); font-size:var(--text-xs); margin-top:var(--sp-2);"><span id="slugAtual">—</span>.sitemob.app <span class="metric-card__site-tag" id="siteOfflineTag" hidden>não publicado</span></p>
        </div>
        <div class="metric-card">
          <p class="metric-card__label">Plano</p>
          <p class="metric-card__value" style="font-size: var(--text-2xl); text-transform:capitalize;" id="planoAtual">—</p>
        </div>
        <div class="metric-card">
          <p class="metric-card__label">Imóveis</p>
          <p class="metric-card__value" style="font-size: var(--text-2xl);" id="imoveisAtual">—</p>
        </div>
        <div class="metric-card">
          <p class="metric-card__label">Contatos este mês</p>
          <p class="metric-card__value" style="font-size: var(--text-2xl);" id="contatosMes">—</p>
          <p style="color:var(--clr-text-light-2); font-size:var(--text-xs); margin-top:var(--sp-2);" id="contatosNota">—</p>
        </div>
      </div>

      <!-- Conteúdo reescrito por painel.js conforme broker.published —
           o markup abaixo é o estado "site no ar". -->
      <div class="admin-quickactions" id="quickActions">
        <div>
          <p class="admin-quickactions__titulo" id="qaTitulo">Comece por aqui</p>
          <p class="admin-quickactions__sub" id="qaSub">Cadastre seus imóveis e acompanhe seu plano.</p>
        </div>
        <div class="admin-quickactions__botoes" id="qaBotoes">
          <a href="admin.html" class="btn btn--accent btn--md">Gerenciar meus imóveis →</a>
          <a href="planos.html" class="btn btn--outline-light btn--md">Ver / trocar plano</a>
        </div>
      </div>

    </main>
  </div>
</div>

<script type="module" src="js/painel.js"></script>
</body>
</html>
