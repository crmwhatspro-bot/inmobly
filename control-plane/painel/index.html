<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inmobly · Painel de clientes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/painel.css">
</head>
<body>

<!-- ── Login gate ─────────────────────────────────────────── -->
<div id="gate" class="gate">
  <div class="gate__box">
    <h1>Inmobly — Painel interno</h1>
    <p>Acesso restrito à equipe Punto Alto.</p>
    <button class="btn btn--primary" id="btnLogin">Entrar com Google</button>
    <p class="gate__msg" id="gateMsg"></p>
  </div>
</div>

<!-- ── Painel ─────────────────────────────────────────────── -->
<div id="painel" class="painel hidden">

  <header class="topbar">
    <h1>Clientes Inmobly</h1>
    <div class="topbar__right">
      <span id="userEmail" class="topbar__email"></span>
      <button class="btn btn--ghost" id="btnLogout">Sair</button>
    </div>
  </header>

  <div class="filters" id="filters">
    <button class="filter is-active" data-filter="all">Todos</button>
    <button class="filter" data-filter="trialing">Trial ativo</button>
    <button class="filter" data-filter="trial-vencendo">Trial vencendo (≤3 dias)</button>
    <button class="filter" data-filter="active">Pago / ativo</button>
    <button class="filter" data-filter="past_due">Inadimplente</button>
    <button class="filter" data-filter="canceled">Cancelado</button>
  </div>

  <div class="layout">

    <div class="list-wrap">
      <table class="brokers-table" id="brokersTable">
        <thead>
          <tr>
            <th>Broker</th>
            <th>Plano</th>
            <th>Status</th>
            <th>Trial</th>
            <th>Imóveis</th>
            <th>Domínio</th>
          </tr>
        </thead>
        <tbody id="brokersBody"></tbody>
      </table>
      <p class="empty-msg hidden" id="emptyMsg">Nenhum broker encontrado com esse filtro.</p>
    </div>

    <aside class="detail" id="detail">
      <p class="detail__placeholder">Selecione um broker na lista para ver os detalhes.</p>
    </aside>

  </div>

</div>

<script type="module" src="js/painel.js"></script>
</body>
</html>
